# プルリクエストと main への push で、lint・型チェック・テスト・本番ビルドを実行する。
# 実際の Gemini を呼ぶ評価（npm run eval）は費用がかかるため、ここでは実行しない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 本番に入る部品に、重大度「高」以上の既知の脆弱性がないかを確かめる
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
