<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>逆転コンシェルジュ</title>
<meta name="description" content="旅先のトラブルを、その日だから得られた体験に変えるAIコンシェルジュ">
<meta name="theme-color" content="#151a2e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌤️</text></svg>">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<header class="head">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>逆転コンシェルジュ</h1>
  </div>
  <p class="tagline">旅先のピンチを、その日だけの思い出に変える</p>
  <p class="mode" id="mode" hidden></p>
</header>

<main>
  <section class="panel" aria-labelledby="t-area">
    <h2 id="t-area">1 — いまどこにいますか</h2>
    <label class="sel area" for="area">
      <select id="area"></select>
    </label>
    <p class="area-hint" id="area-hint"></p>
  </section>

  <section class="panel" aria-labelledby="t-trouble">
    <h2 id="t-trouble">2 — 何が起きましたか</h2>
    <div class="troubles" role="group" aria-label="トラブルの種類">
      <button class="trouble is-on" data-trouble="rain"><span>☔</span>雨が降ってきた</button>
      <button class="trouble" data-trouble="transit_down"><span>🚫</span>電車が止まった</button>
      <button class="trouble" data-trouble="crowded"><span>👥</span>混みすぎている</button>
      <button class="trouble" data-trouble="closed"><span>🔒</span>閉まっていた</button>
      <button class="trouble" data-trouble="unwell"><span>🤒</span>体調がわるい</button>
    </div>
    <label class="note">
      <span>補足（任意）</span>
      <input id="note" type="text" placeholder="例：傘がない。荷物が多い。" autocomplete="off">
    </label>
  </section>

  <section class="panel" aria-labelledby="t-ctx">
    <h2 id="t-ctx">3 — いまの条件</h2>
    <div class="ctx">
      <label class="span2" for="minutes">
        <span>残り時間 <b id="v-time">180</b>分</span>
        <input id="minutes" type="range" min="10" max="480" step="5" value="180">
        <div class="presets" role="group" aria-label="残り時間のプリセット">
          <button type="button" data-min="15">15分</button>
          <button type="button" data-min="30">30分</button>
          <button type="button" data-min="60">1時間</button>
          <button type="button" data-min="180">3時間</button>
          <button type="button" data-min="480">8時間</button>
        </div>
      </label>
      <label>
        <span>残予算 <b id="v-budget">6,000</b>円</span>
        <input id="budget" type="range" min="1000" max="30000" step="1000" value="6000">
      </label>
      <label class="sel">
        <span>移動手段</span>
        <select id="mobility">
          <option value="walk">徒歩</option>
          <option value="transit">公共交通</option>
          <option value="taxi">タクシー</option>
          <option value="car">車</option>
        </select>
      </label>
      <label class="sel">
        <span>同行者</span>
        <select id="party">
          <option value="solo">ひとり</option>
          <option value="couple" selected>カップル</option>
          <option value="family">ファミリー</option>
          <option value="friends">友人グループ</option>
        </select>
      </label>
    </div>
  </section>

  <button id="go" class="go">逆転プランをつくる</button>

  <section class="panel trace" id="trace-panel" hidden aria-labelledby="t-trace" aria-live="polite">
    <h2 id="t-trace">エージェントの思考</h2>
    <ol class="trace-list" id="trace"></ol>
    <details class="raw" id="raw" hidden>
      <summary>判断の根拠を見る</summary>
      <div id="raw-body"></div>
    </details>
  </section>

  <section id="plans" class="plans" aria-live="polite"></section>
</main>

<footer class="foot">
  <p>Google Cloud Agentic AI Hackathon プロトタイプ</p>
  <p class="fine">スポット情報・営業時間はデモ用のサンプルデータです</p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
